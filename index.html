<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад пар та дзвінків</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --window-bg: #1e293b;
            --current-bg: #0369a1;
        }
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent: #0284c7;
            --border: #e2e8f0;
            --window-bg: #f1f5f9;
            --current-bg: #e0f2fe;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 { font-size: 1.5rem; margin: 0; }
        .controls { display: flex; gap: 8px; }
        button {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        button.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }
        .timer-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .days-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }
        .days-container button {
            flex: 1;
            white-space: nowrap;
            padding: 8px 12px;
        }
        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .lesson-card.window {
            opacity: 0.6;
        }
        .lesson-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
        }
        .lesson-name {
            font-size: 1.15rem;
            font-weight: 600;
        }
        .lesson-footer {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>

            <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px;" id="current-time">--:--:--</div>
        </div>
        <div class="controls">
