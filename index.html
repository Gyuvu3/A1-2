<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад пар та дзвінків</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --window-bg: #1e293b;
            --current-bg: #0369a1;
        }
        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent: #0284c7;
            --border: #e2e8f0;
            --window-bg: #f8fafc;
            --current-bg: #e0f2fe;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 { font-size: 1.3rem; margin: 0; }
        .btn-group { display: flex; gap: 8px; }
        button {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .info-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .lesson-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .lesson-card.current {
            border-color: var(--accent);
            background: var(--current-bg);
        }
        .lesson-card.window {
            background: var(--window-bg);
            opacity: 0.7;
        }
        .lesson-top {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: var(--accent);
            font-size: 0.85rem;
        }
        .lesson-title { font-size: 1.1rem; font-weight: 600; }
        .lesson-details {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .days-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 12px;
            padding-bottom: 4px;
        }
        .days-nav button { flex: 1; white-space: nowrap; padding: 6px 10px; font-size: 0.85rem; }
    </style>
</head>
<body data-theme="dark">
<div class="container">
    <header>
        <div>
            <h1 id="week-title">Розклад</h1>
            <div style="font-size: 0.8rem; color: var(--text-secondary);" id="current-time-text">--:--</div>
        </div>
        <div class="btn-group">
            <button id="week-toggle" onclick="toggleWeekType()">Авто</button>
            <button onclick="toggleTheme()">🌙</button>
            <button onclick="openJsonModal()">⚙️</button>
        </div>
    </header>

    <div class="info-panel" id="status-panel">Завантаження розкладу...</div>

    <div class="days-nav" id="days-nav"></div>

    <div id="schedule-list"></div>
</div>

<script>
    // РАСПИСАНИЕ И ЗВОНКИ
    let scheduleData = {
      "sched": {
        "monday": [
          {"num": "1", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "2", "lesson": "Фізика", "teacher": "Чурило Р.С.", "room": "209(нк 2)"},
          {"num": "3", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "4", "lesson": "Іноземна мова", "teacher": "Саламатіна О.О.", "room": "216(нк 2)"},
          {"num": "5", "lesson": "Фізичне виховання", "teacher": "", "room": "зал(нк 1)"}
        ],
        "tuesday": [
          {"num": "1", "lesson": "Фізика", "teacher": "Вахонина Л", "room": "108(нк 2)"},
          {"num": "2", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "3", "lesson": "Хімія", "teacher": "Гирля Л.М.", "room": "304(нк 2)"},
          {"num": "4", "lesson": "Хімія", "teacher": "Гирля Л.М.", "room": "113(нк 1)"}
        ],
        "wednesday": [
          {"num": "1", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "2", "lesson": "Основи Національного Супротиву", "teacher": "Болотських С.В.", "room": ""},
          {"num": "3", "lesson": "кур.год.", "teacher": "", "room": "нк1"},
          {"num": "4", "lesson": "Латинська мова", "teacher": "Пономаренко Н.Г.", "room": "203 (нк 5)"}
        ],
        "thursday": [
          {"num": "1", "lesson": "Введеня до майбутньої професії", "teacher": "Дробітько А.В.", "room": "304(нк 1)"},
          {"num": "2", "lesson": "Безпека життєдіяльності", "teacher": "Мардзявко К.О.", "room": "219(нк 2)"},
          {"num": "3", "lesson": "Основи Національного Супротиву", "teacher": "Болотських С.В.", "room": "004(нк 2)"},
          {"num": "4", "lesson": "Фізика", "teacher": "Чурило Р.С.", "room": "209(нк 2)"}
        ],
        "friday": [
          {"num": "1", "lesson": "Ботаніка", "teacher": "Терещенко А.В.", "room": "310(нк 1)"},
          {"num": "2", "lesson": "Ботаніка ", "teacher": "Миколайчук В.Г.", "room": "304(нк 1)"},
          {"num": "3", "lesson": "Українська мова", "teacher": "Доній В.С.", "room": "213(гнк)"},
          {"num": "4", "lesson": "Основи Національного Супротиву", "teacher": "Болотських С.В.", "room": "301/303(нк 5)"}
        ]
      },
      "denumer": {
        "monday": [
          {"num": "1", "lesson": "Психологія", "teacher": "Улітіна К.А.", "room": "301(нк 2)"},
          {"num": "2", "lesson": "Психологія", "teacher": "Улітіна К.А.", "room": "301(нк 2)"},
          {"num": "3", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "4", "lesson": "Іноземна мова", "teacher": "Саламатіна О.О.", "room": "216(нк 2)"},
          {"num": "5", "lesson": "Фізичне виховання", "teacher": "", "room": ""}
        ],
        "tuesday": [
          {"num": "1", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "2", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "3", "lesson": "Українська мова", "teacher": "Доній В.С.", "room": "312(нк 1)"},
          {"num": "4", "lesson": "Хімія", "teacher": "Гирля Л.М.", "room": "113(нк 1)"}
        ],
        "wednesday": [
          {"num": "1", "lesson": "вікно", "teacher": "", "room": ""},
          {"num": "2", "lesson": "Основи Національного Супротиву", "teacher": "Болотських С.В.", "room": ""},
          {"num": "3", "lesson": "кур.год.", "teacher": "", "room": "нк1"},
          {"num": "4", "lesson": "Латинська мова", "teacher": "Пономаренко Н.Г.", "room": "203 (нк 5)"}
        ],
        "thursday": [
          {"num": "1", "lesson": "Введеня до майбутньої професії", "teacher": "Дробітько А.В.", "room": "304(нк 1)"},
          {"num": "2", "lesson": "Безпека життєдіяльності", "teacher": "Мардзявко К.О.", "room": "219(нк 2)"},
          {"num": "3", "lesson": "Основи Національного Супротиву", "teacher": "Болотських С.В.", "room": "004(нк 2)"},
          {"num": "4", "lesson": "Безпека життєдіяльності", "teacher": "Мардзявко К.О.", "room": "108(нк 2)"}
        ],
        "friday": [
          {"num": "1", "lesson": "Ботаніка", "teacher": "Терещенко А.В.", "room": "310(нк 1)"},
          {"num": "2", "lesson": "Ботаніка ", "teacher": "Миколайчук В.Г.", "room": "304(нк 1)"},
          {"num": "3", "lesson": "Українська мова", "teacher": "Доній В.С.", "room": "213(гнк)"}
        ]
      }
    };

    // ЗВОНКИ ПО КОРПУСАМ
    const bells = {
        " корпуса 2": [ // для нк 2
            {start: "09:00", end: "10:20"},
            {start: "10:35", end: "11:55"},
            {start: "12:25", end: "13:45"},
            {start: "14:00", end: "15:20"},
            {start: "15:35", end: "16:55"},
            {start: "17:10", end: "18:30"}
        ],
        "default": [ // для остальных (нк 1, нк 5, гнк)
            {start: "08:30", end: "09:50"},
            {start: "10:05", end: "11:25"},
            {start: "11:55", end: "13:15"},
            {start: "13:30", end: "14:50"},
            {start: "15:05", end: "16:25"},
            {start: "16:40", end: "18:00"}
        ]
    };

    const daysMap = {
        1: 'monday', 2: 'tuesday', 3: 'wednesday', 4: 'thursday', 5: 'friday', 6: 'saturday', 0: 'sunday'
    };
    const daysNames = {
        'monday': 'Понеділок', 'tuesday': 'Вівторок', 'wednesday': 'Середа', 'thursday': 'Четвер', 'friday': 'П’ятниця'
    };

    let selectedDay = '';
    let manualWeekMode = 'auto'; // 'auto', 'sched' (чисельник), 'denumer' (знаменник)

    function getWeekType() {
        if (manualWeekMode !== 'auto') return manualWeekMode;
        
        // Автоматический расчет недели (четная/нечетная от базовой даты)
        const now = new Date();
        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const weekNumber = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
        
        return weekNumber % 2 !== 0 ? 'sched' : 'denumer';
    }

    function toggleWeekType() {
        if (manualWeekMode === 'auto') manualWeekMode = 'sched';
        else if (manualWeekMode === 'sched') manualWeekMode = 'denumer';
        else manualWeekMode = 'auto';

        document.getElementById('week-toggle').innerText = manualWeekMode === 'auto' ? 'Авто' : (manualWeekMode === 'sched' ? 'Чисельник' : 'Знаменник');
        render();
    }

    function getBellsForRoom(roomStr) {
        if (roomStr && roomStr.toLowerCase().includes('нк 2')) {
            return bells[" корпуса 2"];
        }
        return bells["default"];
    }

    function init() {
        const todayNum = new Date().getDay();
        selectedDay = daysMap[todayNum] || 'monday';
        if (selectedDay === 'saturday' || selectedDay === 'sunday') selectedDay = 'monday';
        renderNav();
        render();
        setInterval(updateClock, 1000);
    }

    function renderNav() {
        const nav = document.getElementById('days-nav');
        nav.innerHTML = '';
        Object.keys(daysNames).forEach(dayKey => {
            const btn = document.createElement('button');
            btn.innerText = daysNames[dayKey];
            if (dayKey === selectedDay) btn.classList.add('active');
            btn.onclick = () => { selectedDay = dayKey; renderNav(); render(); };
            nav.appendChild(btn);
        });
    }

    function render() {
        const weekType = getWeekType();
        const weekName = weekType === 'sched' ? '🟢 Чисельник' : '🔵 Знаменник';
        document.getElementById('week-title').innerText = `Розклад (${weekName})`;

        const listContainer = document.getElementById('schedule-list');
        listContainer.innerHTML = '';

        const lessons = scheduleData[weekType][selectedDay] || [];

        if (lessons.length === 0) {
            listContainer.innerHTML = '<div class="lesson-card"><div class="lesson-title">Вихідний або пар немає 🎉</div></div>';
            return;
        }

        lessons.forEach(item => {
            const card = document.createElement('div');
            const isWindow = item.lesson.toLowerCase().includes('вікно');
            card.className = `lesson-card ${isWindow ? 'window' : ''}`;

            const bellList = getBellsForRoom(item.room);
            const bellIndex = parseInt(item.num) - 1;
            const bellTime = bellList[bellIndex] ? `${bellList[bellIndex].start} - ${bellList[bellIndex].end}` : '';

            card.innerHTML = `
                <div class="lesson-top">
                    <span>Пара №${item.num}</span>
                    <span>${bellTime}</span>
                </div>
                <div class="lesson-title">${item.lesson}</div>
                <div class="lesson-details">
                    <span>${item.teacher || ''}</span>
                    <span>📍 ${item.room || 'Аудиторія не вказана'}</span>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        document.getElementById('current-time-text').innerText = timeStr;
    }

    function toggleTheme() {
        const body = document.body;
        body.dataset.theme = body.dataset.theme === 'dark' ? 'light' : 'dark';
    }

    function openJsonModal() {
        const newJson = prompt("Вставте новий JSON розкладу:", JSON.stringify(scheduleData, null, 2));
        if (newJson) {
            try {
                scheduleData = JSON.parse(newJson);
                render();
                alert("Розклад успішно оновлено!");
            } catch (e) {
                alert("Помилка у форматі JSON!");
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
